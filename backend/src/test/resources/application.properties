# The test context boots against a real Postgres so Flyway actually runs the migrations.
# Flyway runs at boot, so a bad migration is a full backend outage, and a push to main
# deploys straight to Railway — the migrations must be exercised somewhere before that.
# Only Redis and Kafka stay excluded: neither is ever run (see the dead-infra notes) and
# neither has a service container in CI.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.kafka.annotation.EnableKafka
# A throwaway database, never the dev one. CI creates it fresh in a service container;
# locally: createdb towin_test
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/towin_test}
app.jwt.secret=test-only-secret-never-used-in-production-safe-to-be-public
app.jwt.expiration-ms=3600000
