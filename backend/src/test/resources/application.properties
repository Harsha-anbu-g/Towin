# The test context boots against a real Postgres so Flyway actually runs the migrations.
# Flyway runs at boot, so a bad migration is a full backend outage, and a push to main
# deploys straight to Railway — the migrations must be exercised somewhere before that.
# Only Redis and Kafka stay excluded: neither is ever run (see the dead-infra notes) and
# neither has a service container in CI. These are the same three classes application.yml
# excludes in production, and they have to be auto-configuration classes: Boot rejects an
# exclusion that names anything else, so the old entry here — the @EnableKafka annotation,
# which is not one — refused to build a full application context. Slice tests never noticed.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# A throwaway database, never the dev one. CI creates it fresh in a service container;
# locally: createdb towin_test
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/towin_test}
app.jwt.secret=test-only-secret-never-used-in-production-safe-to-be-public
app.jwt.expiration-ms=3600000
# DemoDataSeeder is an ApplicationRunner with matchIfMissing = true, so any test that boots the
# whole context would otherwise write the entire demo — nineteen accounts, their connections,
# needs, messages and letters — into towin_test on every run, and purge them again on the next.
# The demo belongs to the running app, not to the test database.
app.demo.seed-enabled=false
# A working Sealed box for the test context, so anything that boots Spring exercises the
# real SealedCryptoService instead of the switched-off path. Test-only and safe to be
# public, same footing as the JWT secret above: base64 of 32 fixed bytes.
passon.sealed.master-key=dGVzdC1vbmx5LXNlYWxlZC1ib3gta2V5LTMyYnl0ZXM=
