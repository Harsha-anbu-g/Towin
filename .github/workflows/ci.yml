name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Hard gate: Flyway runs at boot, so a bad migration is not a failed request, it is a
    # backend that will not start — and a push to main deploys straight to Railway. This
    # throwaway database is where the migrations get to fail instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: towin
          POSTGRES_PASSWORD: towin
          POSTGRES_DB: towin_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      # Turns on the DB-backed tests, which skip themselves everywhere else.
      TOWINLY_DB_TESTS: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/towin_test
      SPRING_DATASOURCE_USERNAME: towin
      SPRING_DATASOURCE_PASSWORD: towin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test

  frontend:
    name: Frontend lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      # Hard gate: the frontend is lint-clean (0 errors, 0 warnings) as of the
      # 2026-07-09 audit fixes — a failure here means new lint debt.
      - name: Lint
        run: npm run lint
      # Hard gate: raw hex colors in JSX silently break night mode (theme is
      # CSS-token driven). Allowlist lives in scripts/check-tokens.mjs.
      - name: Theme-token check
        run: npm run check:tokens
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
